name: GetHog
options:
  bundleIdPrefix: app.gethog
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
    tvOS: "26.0"
    visionOS: "26.0"
  createIntermediateGroups: true
  # XcodeGen 2.46.0 still writes the pre-Xcode-26 watch embed: a copy phase
  # into $(CONTENTS_FOLDER_PATH)/Watch with dstSubfolderSpec 16 (XcodeGen
  # issue #1613). Xcode 26 installs and validates the watch app from PlugIns/
  # — dstSubfolderSpec 13, the same destination the appex embeds already use —
  # so the generated project is patched here until XcodeGen learns this.
  #
  # The guard is the load-bearing half, not the sed. Counting *afterwards*
  # proves nothing — the sed rewrites every spec-16 entry unconditionally, so
  # "zero remain" is true by construction and stays true through all three
  # ways this can drift: XcodeGen fixing #1613 (the sed silently no-ops and
  # nobody learns the patch is dead), a second legitimate spec-16 phase
  # appearing (an App Clip embed is exactly this shape — the sed would redirect
  # it into PlugIns/ and break the archive), or the dstPath spelling changing
  # (half the patch no-ops and the watch app lands where Xcode will not look
  # for it). So both patterns are counted *before* the rewrite, and anything
  # but exactly one of each fails generation with the counts in the message.
  #
  # Idempotent because XcodeGen rewrites project.pbxproj from this spec on
  # every run — the counts always see a fresh, unpatched file — not because
  # the patterns stop matching.
  #
  # The path is relative to the working directory, which is the documented
  # workflow: `xcodegen generate` from the repository root. Run from anywhere
  # else it fails on the -f test rather than skipping the patch in silence.
  postGenCommand: |
    project=GetHog.xcodeproj/project.pbxproj
    [ -f "$project" ] || { echo "XcodeGen#1613 patch: $project not found — run xcodegen from the repository root" >&2; exit 1; }
    phases=$(grep -c 'dstSubfolderSpec = 16;' "$project" || true)
    paths=$(grep -c 'dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";' "$project" || true)
    [ "$phases" = 1 ] && [ "$paths" = 1 ] || { echo "XcodeGen#1613 patch: expected exactly one legacy watch embed, found $phases spec-16 phase(s) and $paths legacy dstPath(s) — read the comment in project.yml before changing the sed" >&2; exit 1; }
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' "$project"

packages:
  GetHogKit:
    path: GetHogKit
  GetHogUI:
    path: GetHogUI

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Required, and required to MATCH between the app and its extension:
    # without them the installer cannot create the app-extension placeholder
    # and rejects the whole bundle with "Invalid placeholder attributes".
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GetHog:
    type: application
    platform: iOS
    sources:
      - path: GetHog/Sources
      - path: GetHog/Resources
        buildPhase: resources
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
      - target: GetHogWidgets
        embed: true
      # The watch app ships inside the phone app: one submission, one install.
      # XcodeGen writes this embed to the wrong destination for Xcode 26 —
      # see the postGenCommand at the top of this file.
      - target: GetHogWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog
        PRODUCT_NAME: GetHog
        GENERATE_INFOPLIST_FILE: YES
        # Base plist merged with the generated keys below. Required for
        # BGTaskSchedulerPermittedIdentifiers, UIBackgroundModes and
        # NSUserActivityTypes: INFOPLIST_KEY_* only understands keys Xcode has a
        # schema for and drops the rest without a warning. Verified — all three
        # were INFOPLIST_KEY_* settings first and none reached the built app.
        INFOPLIST_FILE: GetHog/Support/GetHog-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHog/Support/GetHog.entitlements
        # Required: iOS terminates an app that evaluates Face ID without a
        # purpose string. Used before revealing the stored API key and,
        # optionally, before toggling a live feature flag.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "GetHog asks for Face ID before revealing your PostHog API key or changing a live feature flag."
        # The app's only cryptography is TLS via URLSession, which is exempt
        # from export documentation. Declaring it here answers App Store
        # Connect's per-build export-compliance question once, for every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: GetHog
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  # Widgets and Control Center controls. Reads the App Group cache written by
  # the app — it must never call the API directly, because the rate-limit budget
  # is organisation-wide and shared with the user's own integrations.
  GetHogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GetHogWidgets
      # `GetHog/Sources/Intents` is deliberately **not** compiled here, and it
      # used to be, under a comment claiming "entities and intents are shared
      # with the app target". Nothing in `GetHogWidgets/` references a single
      # symbol from that directory — the widgets' own configuration intents use
      # `WidgetFlagEntity` / `WidgetMetricEntity`, which read the App Group
      # snapshot. So it bought nothing, and it cost the following, all read out
      # of the built bundles rather than reasoned about:
      #
      #   - `GetHogWidgets.appex/Metadata.appintents/extract.actionsdata`
      #     declared `GetMetricValueIntent`, `SearchEventsIntent`,
      #     `SetFeatureFlagIntent`, `OpenDashboardIntent`, `ProjectFocusFilter`
      #     and `ShowGetHogSearchResultsIntent` — the same type names the app
      #     declares — plus all four API-backed entity queries. An intent vended
      #     by an extension is performed *in that extension's process*.
      #   - `Metadata.appintents/root.ssu.yaml` in the appex carried
      #     `bundleIdentifier: app.gethog.GetHog.Widgets` and the four App
      #     Shortcut phrase sets, because `GetHogShortcuts` compiled into both
      #     targets and both registered an `AppShortcutsProvider`.
      #
      # Which made the extension able to run exactly what this target's whole
      # design forbids: `IntentDependencies.resolve()` builds a `PostHogClient`
      # and spends the organisation-wide rate-limit budget, and
      # `ToggleFlagFromWidgetIntent` right there in `FlagWidget.swift` documents
      # at length why a keychain read, the governor and a biometric prompt do not
      # belong in an extension — while `SetFeatureFlagIntent`, compiled in beside
      # it, did all three.
      #
      # `GetHog/Sources/Flags/FlagToggleController.swift` is gone from this
      # list for the same reason and by the same measurement. It was here for
      # `FlagQuickToggle` / `BiometricGate`, and nothing in `GetHogWidgets/`
      # names either: the widgets read the quick-toggle opt-in out of the App
      # Group snapshot (`SharedSnapshot.quickToggleFlags`, via
      # `WidgetCache.quickToggleFlags()`), which is the only form of it that
      # crosses the process boundary anyway. Compiling the file here also pulled
      # `IntentDonations` — and therefore the whole intents directory — in behind
      # it, which is how the two entries kept each other alive.
    dependencies:
      - package: GetHogKit
      # The design tokens used to arrive as a single compiled-in file,
      # `GetHog/Sources/Common/Theme.swift`, because two places had hand-copied
      # `Theme.accent`'s literals under a comment saying importing it here was
      # impossible. It never was, and now it is not even a file: `Theme` lives
      # in GetHogUI, which the app links too — so a widget and the app that
      # owns it are the same colour by construction, which is what compiling
      # the file in used to buy.
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.Widgets
        PRODUCT_NAME: GetHogWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHog/Support/GetHogWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHog/Support/GetHogWidgets.entitlements
        SKIP_INSTALL: YES

  # The native macOS app: the same bundle id on a different platform, compiling
  # GetHog/Sources wholesale minus the four iOS-lifecycle files. GetHogMac/
  # holds only the Mac scene and the stub shell; everything reusable stays in
  # the shared tree behind `#if` seams (see Common/MacAdaptations.swift).
  # LinkInbox.swift is deliberately *not* excluded: its mailbox, LinkNotice and
  # intent routing are consumed by shared screens — only its UIKit delegates
  # are iOS, and they sit behind `#if os(iOS)` in the file itself.
  GetHogMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GetHogMac/Sources
      - path: GetHog/Sources
        excludes:
          - App/GetHogApp.swift
          - App/QuickActions.swift
          - App/BackgroundRefresh.swift
          - App/RootView.swift
      - path: GetHog/Resources
        buildPhase: resources
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
      - target: GetHogMacWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog
        PRODUCT_NAME: GetHog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogMac/Support/GetHogMac-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GetHog
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
      # Two entitlements files, chosen by configuration, because one file
      # cannot be both buildable by a fresh clone and complete for a signed
      # build. Either the App Group or the shared keychain group, alone, makes
      # a macOS target refuse to build without a development certificate —
      # measured by adding each separately to the Debug file — and
      # `DEVELOPMENT_TEAM` is empty above because a team id is an account
      # detail, not a project fact (DEVELOPMENT.md, "App Store archive and
      # signing"). iOS never met this: a Simulator build is not signed against
      # a profile.
      #
      # So the split is along the axis the constraint actually runs on. Debug
      # is what a clone with no certificate builds and runs, and it carries
      # sandbox and network client only. Release is what gets archived, always
      # with a team supplied on the command line, and it carries both groups by
      # construction — nobody has to remember to add them back. Compile-check
      # the Release half without signing:
      #
      #   xcodebuild build -project GetHog.xcodeproj -scheme GetHogMac \
      #     -destination 'platform=macOS' -configuration Release \
      #     CODE_SIGNING_ALLOWED=NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: GetHogMac/Support/GetHogMac.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: GetHogMac/Support/GetHogMac-Distribution.entitlements

  # The Mac desktop widgets: the same three portable widgets, compiled out of
  # GetHogWidgets/ the way GetHogMac compiles GetHog/Sources — shared files,
  # not copies, so the two platforms cannot drift. Reads the App Group cache the
  # app writes and must never call the API itself; here that is structural
  # rather than merely intended, because the entitlements carry no
  # network-client key at all.
  GetHogMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: GetHogMacWidgets/Sources
      - path: GetHogWidgets
        excludes:
          # The iOS bundle registers the Control Center controls, and
          # `ControlWidget` does not exist on macOS — the SDK marks every
          # control and accessory surface unavailable rather than unused, so
          # this file is excluded outright rather than seamed. The Mac bundle
          # in GetHogMacWidgets/Sources registers the three that do exist.
          - GetHogWidgetBundle.swift
          - ControlCenterWidgets.swift
    dependencies:
      - package: GetHogKit
      # Same token-sharing move as the iOS extension (see the comment on that
      # target): a widget is the last surface that can afford to be a different
      # colour from the app it belongs to.
      - package: GetHogUI
    settings:
      base:
        # The same bundle id and product name as the iOS extension, which is
        # the arrangement the two app targets already use for universal
        # purchase — and macOS additionally requires an appex id prefixed by
        # its host app's id, which `app.gethog.GetHog.Widgets` satisfies.
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.Widgets
        PRODUCT_NAME: GetHogWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogMacWidgets/Support/GetHogMacWidgets-Info.plist
        SKIP_INSTALL: YES
      # The same two-file split as GetHogMac above, on the same measured axis:
      # the App Group entitlement alone makes a teamless macOS target refuse to
      # build, Debug is what a fresh clone builds, and Release always signs with
      # a team. Compile-check the Release half the same way:
      #
      #   xcodebuild build -project GetHog.xcodeproj -scheme GetHogMac \
      #     -destination 'platform=macOS' -configuration Release \
      #     CODE_SIGNING_ALLOWED=NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: GetHogMacWidgets/Support/GetHogMacWidgets.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: GetHogMacWidgets/Support/GetHogMacWidgets-Distribution.entitlements

  # visionOS: the same bundle identity as iOS and macOS — one app, every
  # platform — and now the same shared catalog the Mac compiles, around a
  # Vision-shaped shell in GetHogVision/Sources.
  GetHogVision:
    type: application
    platform: visionOS
    sources:
      - path: GetHogVision/Sources
      - path: GetHog/Sources
        # Exactly GetHogMac's four exclusions, and for the same reasons:
        # each names an iOS-only scene, delegate or scheduler that this
        # target replaces with its own. There was nothing AppKit-specific
        # to subtract, so the two lists are identical rather than merely
        # similar.
        #
        # Two files the brief provisionally listed stay *in*. LinkInbox
        # keeps its mailbox, LinkNotice and intent routing — consumed by
        # shared screens — with only its UIKit delegates behind
        # `#if os(iOS)`, which the Mac target already proves works. And
        # Player/ReplayPlayerView compiles here for real: the shared iOS
        # web-view wrapper was widened to visionOS, so this target plays
        # replays rather than standing a placeholder in front of them, and
        # the session screen's diagnostics sit beside a working stage.
        excludes:
          - App/GetHogApp.swift
          - App/QuickActions.swift
          - App/BackgroundRefresh.swift
          - App/RootView.swift
      # The whole resource directory, not just DemoData: demo mode needs the
      # fixtures, and the rrweb player bundle rides along for whoever lands
      # real replay here.
      - path: GetHog/Resources
        buildPhase: resources
      - path: GetHogVision/Resources
        buildPhase: resources
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
      - target: GetHogVisionWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog
        PRODUCT_NAME: GetHog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogVision/Support/GetHogVision-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogVision/Support/GetHogVision.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: GetHog
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The compiled set reaches LAContext twice — revealing the stored key
        # in Settings, and the feature-flag write gate — and visionOS answers
        # both with Optic ID, which is why the string says so. `NSFaceID…` is
        # still the key's name on every platform.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "GetHog asks for Optic ID before revealing your PostHog API key or changing a live feature flag."
        ASSETCATALOG_COMPILER_APPICON_NAME: VisionAppIcon
        TARGETED_DEVICE_FAMILY: "7"
        ENABLE_PREVIEWS: YES

  # Same contract as every other widget target: reads the App Group snapshot,
  # never calls the API.
  GetHogVisionWidgets:
    type: app-extension
    platform: visionOS
    sources:
      - path: GetHogVisionWidgets/Sources
      - path: GetHogWidgets
        excludes:
          # The iOS bundle file registers the Control Center controls, and
          # that surface does not exist on visionOS any more than on macOS —
          # excluded outright rather than seamed, exactly as the Mac target
          # does. The Vision bundle in GetHogVisionWidgets/Sources registers
          # the three widgets that do exist.
          - GetHogWidgetBundle.swift
          - ControlCenterWidgets.swift
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogVisionWidgets/Support/GetHogVisionWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogVisionWidgets/Support/GetHogVisionWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "7"
        SKIP_INSTALL: YES

  # watchOS: its own bundle id under the iOS app's, embedded in the iOS app.
  # The Info.plist carries the WK* keys that pair it to the phone and let it
  # run without one. The embed lands in PlugIns/ via the postGenCommand above.
  GetHogWatch:
    type: application
    platform: watchOS
    sources:
      - path: GetHogWatch/Sources
      - path: GetHog/Resources/DemoData
        buildPhase: resources
      # The Watch app reads standard defaults for hand-off metadata and wake
      # scheduling, so its own bundle must carry the required-reason manifest;
      # the copy embedded in the containing iOS app is a different bundle.
      - path: GetHog/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: GetHogWatch/Resources
        buildPhase: resources
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
      - target: GetHogWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogWatch/Support/GetHogWatch-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogWatch/Support/GetHogWatch.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: GetHog
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES

  GetHogWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: GetHogWatchWidgets/Sources
      # The appex needs the two pure files the watch app also compiles.
      # Compiling a source into both binaries is the standard shared-source
      # pattern — each carries its own copy — and keeping them app-target
      # files is what lets GetHogWatchTests reach them: a scoring rule
      # nobody can run is a rule nobody can check.
      - path: GetHogWatch/Sources/WatchWidgetCore.swift
      - path: GetHogWatch/Sources/WatchActivityStore.swift
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.watchkitapp.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogWatchWidgets/Support/GetHogWatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogWatchWidgets/Support/GetHogWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  # tvOS: the same bundle identity again, around the curated read-mostly
  # subset — the five product surfaces a living room can use, plus Settings,
  # plus the support they compile against.
  #
  # Two directories are absent on purpose. Alerts/ cannot ride: tvOS cannot
  # present a notification at all (`UNMutableNotificationContent`'s title,
  # body, sound and thread fields are every one of them unavailable), so a
  # screen that configured one would be a promise the platform cannot keep.
  # Intents/ cannot earn its place: tvOS has App Intents, but no Siri surface,
  # no Spotlight to search and no shortcut menu to suggest into, so donating
  # would teach the system actions nothing can offer. Both are twinned in
  # `GetHogTV/Sources/TVAdaptations.swift` so the shared call sites stay
  # byte-identical.
  #
  # Player/ rides minus its two WebKit files — the module is not in the tvOS
  # SDK — which keeps the whole fetch-and-parse pipeline: `ReplayLoader`,
  # the diagnostics model and the console and network readers all compile
  # here. `SessionDetailView` embeds the native `TVReplayTimelineView` where
  # the other platforms embed the player.
  GetHogTV:
    type: application
    platform: tvOS
    sources:
      - path: GetHogTV/Sources
      - path: GetHog/Sources/Dashboards
      - path: GetHog/Sources/Insights
      - path: GetHog/Sources/Events
      - path: GetHog/Sources/Sessions
      - path: GetHog/Sources/Flags
      - path: GetHog/Sources/Settings
      - path: GetHog/Sources/Common
      # Comments/ and People/ are not TV surfaces of their own; they ride
      # because the ridden screens need them. `DashboardDetailView` and
      # `SavedInsightDetailView` mount `CommentsSection`, and
      # `InsightDrillDown` mounts `PersonDetailView` and `PersonAvatar`.
      - path: GetHog/Sources/Comments
      - path: GetHog/Sources/People
      - path: GetHog/Sources/Player
        excludes:
          - ReplayPlayerView.swift   # imports WebKit — the module is absent on tvOS
          - ExpandedReplayView.swift # consumes the WebKit stage
      # App/ file by file rather than as a directory: most of it is the iOS
      # shell. `TabRootView` switches over all 35 roots, of which this target
      # compiles six; `GetHogApp`/`RootView`/`QuickActions`/`BackgroundRefresh`
      # are per-platform, as they are for the Mac and Vision.
      - GetHog/Sources/App/AppTab.swift
      - GetHog/Sources/App/AppModel.swift
      - GetHog/Sources/App/DemoTransport.swift
      - GetHog/Sources/App/DebugLaunch.swift
      - GetHog/Sources/App/OpenDetails.swift
      - GetHog/Sources/App/WindowTarget.swift
      - GetHog/Sources/App/NavPreferences.swift
      - GetHog/Sources/App/LinkInbox.swift
      - GetHog/Sources/App/PostHogLink.swift
      - GetHog/Sources/App/ProjectSwitcher.swift
      # Branded empty states are shared SwiftUI views, so their named images
      # must travel with every host that compiles those views. The TV catalog
      # below owns only App Icon / Top Shelf artwork.
      - path: GetHog/Resources/Assets.xcassets
        buildPhase: resources
      - path: GetHog/Resources/DemoData
        buildPhase: resources
      # Shared screens use app-private defaults on TV too. App Store validation
      # inspects this platform bundle, not the iOS app with the same identity.
      - path: GetHog/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: GetHogTV/Resources
        buildPhase: resources
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
      - target: GetHogTVTopShelf
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog
        PRODUCT_NAME: GetHog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogTV/Support/GetHogTV-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogTV/Support/GetHogTV.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: GetHog
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_PREVIEWS: YES

  # The Top Shelf. It renders the App Group snapshot the TV app writes and
  # calls no API — see `TVTopShelfContent.swift` for the rule and the reason.
  # GetHogUI is linked for one thing only, `Double.compactFormatted`: the
  # shelf's captions and the wallboard's headline are the same number in the
  # same hand, and two spellings of that is one of them going wrong. Nothing
  # here draws a SwiftUI view.
  GetHogTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: GetHogTVTopShelf/Sources
      # Compiled here a second time, from the app target. `GetHogWatch/Sources/
      # WatchWidgetCore.swift` does this for the same reason: `GetHogTVTests`
      # does not compile this appex and an appex has no test host, so a rule
      # that lived only here is a rule nobody can run.
      - path: GetHogTV/Sources/TVTopShelfContent.swift
    dependencies:
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHog.TopShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: GetHogTVTopShelf/Support/GetHogTVTopShelf-Info.plist
        CODE_SIGN_ENTITLEMENTS: GetHogTVTopShelf/Support/GetHogTVTopShelf.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        SKIP_INSTALL: YES

  GetHogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GetHog/Tests
    dependencies:
      - target: GetHog
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogTests
        GENERATE_INFOPLIST_FILE: YES

  # Accessibility regressions are invisible to the unit tests: every one of them
  # is a fact about the *rendered* tree — how many elements a web view leaks, how
  # big a tap target ends up, whether a card carries the button trait — and none
  # of those exist until the view is on a screen. Each defect pinned here was
  # first found by hand-building a throwaway XCUITest harness, which is a
  # measurement nobody repeats.
  #
  # Driven entirely in demo mode (`-GetHogDemo`), so a run is deterministic
  # and never spends the organisation's shared rate-limit budget.
  GetHogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GetHogUITests
        # The screenshot harness lives beside these tests but is deliberately
        # not one of them — see `GetHogScreenshots` below.
        excludes:
          - Screenshots/**
    dependencies:
      - target: GetHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHog

  # The screenshot harness: launches the demo build once per screen and writes a
  # PNG of what actually came up, so shipped UI can be *reviewed* rather than
  # reasoned about.
  #
  # A target of its own, and this is the part that needed a project change. A
  # full sweep is minutes — many screens across multiple configurations, each a
  # real launch — where `GetHogUITests` is the target the project's own
  # verification command runs on every pass
  # (`xcodebuild test -only-testing:GetHogUITests`). Folding the
  # harness into that target would make every verification pass pay for it.
  #
  # Skipping by environment flag was tried first and does not work here:
  # `TEST_RUNNER_`-prefixed variables on the `xcodebuild` command line were
  # measured **not** reaching the UI-test runner's `ProcessInfo.environment`
  # under this toolchain, so there is no channel to tell an in-target test to
  # stand down. A separate target and scheme need no channel.
  #
  # Sources are the harness directory plus `DemoLaunch.swift`, shared with the
  # audit target rather than copied: its `wait`/`settle`/`pause` encode measured
  # facts about this app (poll `exists`, never `waitForExistence`), and two
  # copies would drift.
  GetHogScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GetHogUITests/Screenshots
      - GetHogUITests/DemoLaunch.swift
    dependencies:
      - target: GetHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogScreenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHog

  # The Mac twin of GetHogTests. Its sources are the whole of `GetHogMac/Tests`
  # on purpose: the directory is the contract, so a task dropping a test file
  # there is in the suite the moment the project is regenerated — no per-file
  # registration to forget.
  GetHogMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GetHogMac/Tests
      # Compiled in, not imported: the widget extension is an appex, not a
      # framework, so this is the only route a test has to its pure logic. One
      # file on purpose — WidgetCache.swift holds the refresh cadence, the
      # freshness arithmetic and the empty-state words, and references nothing
      # else in GetHogWidgets/.
      - GetHogWidgets/WidgetCache.swift
    dependencies:
      - target: GetHogMac
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogMacTests
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out because the derived one is wrong here, and wrong in a way
        # that only shows up at launch. XcodeGen builds a test host path out of
        # the *target* name — `GetHogMac.app/Contents/MacOS/GetHogMac` — while
        # `GetHogMac` above sets `PRODUCT_NAME: GetHog`, so the bundle it
        # actually produces is `GetHog.app/Contents/MacOS/GetHog` and the
        # derived path names a binary nothing builds. iOS never met this:
        # `GetHog`'s target and product names agree.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GetHog.app/Contents/MacOS/GetHog"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Demo-mode XCUITests on the macOS destination. `DemoLaunch.swift` is shared
  # with the iOS targets rather than copied, exactly as `GetHogScreenshots`
  # shares it: its wait/settle/pause helpers encode measured facts about this
  # app, and two copies would drift.
  GetHogMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GetHogMac/UITests
      - path: GetHogUITests/DemoLaunch.swift
    dependencies:
      - target: GetHogMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHogMac

  # The visionOS twin of GetHogTests: the directory is the contract, so a
  # task dropping a test file there is in the suite on regeneration.
  GetHogVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - GetHogVision/Tests
      # Compiled in, not imported, for the reason GetHogMacTests documents:
      # the widget extension is an appex, not a framework. One file on
      # purpose — WidgetCache.swift references nothing else in GetHogWidgets/.
      - GetHogWidgets/WidgetCache.swift
    dependencies:
      - target: GetHogVision
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogVisionTests
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out for the reason GetHogMacTests documents: XcodeGen
        # derives the host path from the *target* name, and GetHogVision's
        # product is GetHog.app. iOS-style bundles are flat — no
        # Contents/MacOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GetHog.app/GetHog"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GetHogVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: GetHogVision/UITests
      # Shared with the iOS and Mac UI targets rather than copied, for the
      # reason GetHogMacUITests records: its wait/settle/pause helpers encode
      # measured facts about this app, and two copies would drift.
      - path: GetHogUITests/DemoLaunch.swift
    dependencies:
      - target: GetHogVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogVisionUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHogVision

  # No TEST_HOST override here, unlike its vision and TV siblings: the watch
  # target's product name *is* GetHogWatch, so XcodeGen's derived path names a
  # binary that exists. The override is only needed where PRODUCT_NAME
  # diverges from the target name.
  GetHogWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - GetHogWatch/Tests
    dependencies:
      - target: GetHogWatch
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogWatchTests
        GENERATE_INFOPLIST_FILE: YES

  GetHogWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: GetHogWatch/UITests
      # Shared, not copied — see GetHogMacUITests. The polling waits matter
      # most here: referencing a failing XCTest wait long enough has already
      # taken this platform's test host down once (task-4 report §9.3).
      - path: GetHogUITests/DemoLaunch.swift
    dependencies:
      - target: GetHogWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogWatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHogWatch

  GetHogTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - GetHogTV/Tests
    dependencies:
      - target: GetHogTV
      - package: GetHogKit
      - package: GetHogUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogTVTests
        GENERATE_INFOPLIST_FILE: YES
        # Same derived-host defect as GetHogVisionTests: the product is
        # GetHog.app, not GetHogTV.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GetHog.app/GetHog"
        BUNDLE_LOADER: "$(TEST_HOST)"

  GetHogTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: GetHogTV/UITests
      # Shared, not copied — see GetHogMacUITests. The launch gate inside it
      # takes a tvOS arm of its own, because a tvOS shell draws no navigation
      # bar for the iOS arm to wait on.
      - path: GetHogUITests/DemoLaunch.swift
    dependencies:
      - target: GetHogTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gethog.GetHogTVUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GetHogTV

schemes:
  GetHog:
    build:
      targets:
        GetHog: all
        GetHogTests: [test]
        GetHogUITests: [test]
    test:
      targets:
        - GetHogTests
        - GetHogUITests

  GetHogMac:
    build:
      targets:
        GetHogMac: all
        GetHogMacTests: [test]
        GetHogMacUITests: [test]
    test:
      targets:
        - GetHogMacTests
        - GetHogMacUITests

  GetHogVision:
    build:
      targets:
        GetHogVision: all
        GetHogVisionTests: [test]
        GetHogVisionUITests: [test]
    test:
      targets:
        - GetHogVisionTests
        - GetHogVisionUITests

  GetHogWatch:
    build:
      targets:
        GetHogWatch: all
        GetHogWatchTests: [test]
        GetHogWatchUITests: [test]
    test:
      targets:
        - GetHogWatchTests
        - GetHogWatchUITests

  GetHogTV:
    build:
      targets:
        GetHogTV: all
        GetHogTVTests: [test]
        GetHogTVUITests: [test]
    test:
      targets:
        - GetHogTVTests
        - GetHogTVUITests

  # `xcodebuild test -project GetHog.xcodeproj -scheme GetHogScreenshots \
  #    -destination 'platform=iOS Simulator,name=iPhone 17'`
  #
  # Writes `build/Screenshots/<device>/{light,dark,ax5}/<screen>.png`. Re-run
  # with an iPad destination for the iPad half; nothing else changes.
  GetHogScreenshots:
    build:
      targets:
        GetHog: all
        GetHogScreenshots: [test]
    test:
      targets:
        - GetHogScreenshots
